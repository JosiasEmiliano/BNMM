<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentaciones y Material</title>
<style>
  body{font-family:system-ui,sans-serif;background:#FFF8E7;color:#2A2540;
       max-width:600px;margin:0 auto;padding:30px 20px}
  h1{font-size:2rem;margin-bottom:.2em;text-align:center}
  p.sub{opacity:.7;margin-top:0;text-align:center}
  ul{list-style:none;padding:0;margin-top:30px}
  li{margin:15px 0}
  a{display:block;padding:18px 22px;background:#fff;border:3px solid #2A2540;
    border-radius:18px;text-decoration:none;color:#2A2540;font-weight:700;
    font-size:1.1rem;box-shadow:5px 5px 0 rgba(42,37,64,.85);transition:.15s}
  a:hover{background:#FFC93C;transform:translate(-2px,-2px)}
  .cargando{text-align:center;opacity:.6;font-style:italic}
</style>
</head>
<body>
  <h1>📚 Presentaciones de Clase</h1>
  <p class="sub">Toca una para abrirla.</p>
  <ul id="lista"><li class="cargando">Cargando presentaciones...</li></ul>

<script>
  // ⚠️ Estos son tus datos. No los cambies.
  const USUARIO = "JosiasEmiliano";
  const REPO = "BNMM";
  
  // Esta es la dirección de la API de GitHub que lista los archivos
  const API_URL = `https://api.github.com/repos/${USUARIO}/${REPO}/contents/`;

  fetch(API_URL)
    .then(respuesta => respuesta.json())
    .then(archivos => {
      const lista = document.getElementById('lista');
      
      // Filtramos: solo queremos archivos .html, y excluimos el index.html
      const presentaciones = archivos
        .filter(archivo => archivo.name.toLowerCase().endsWith('.html') && archivo.name.toLowerCase() !== 'index.html')
        .sort((a, b) => a.name.localeCompare(b.name)); // Orden alfabético

      if (presentaciones.length === 0) {
        lista.innerHTML = '<li class="cargando">Aún no hay presentaciones subidas.</li>';
        return;
      }

      // Creamos los botones automáticamente
      lista.innerHTML = presentaciones.map(archivo => {
        // Quitamos el .html y cambiamos guiones por espacios para que se vea bonito
        const titulo = archivo.name.replace('.html', '').replace(/-/g, ' ');
        return `<li><a href="${archivo.name}">📄 ${titulo}</a></li>`;
      }).join('');
    })
    .catch(error => {
      document.getElementById('lista').innerHTML = 
        '<li class="cargando">⚠️ Error al cargar la lista. Recarga la página en un momento.</li>';
    });
</script>
</body>
</html>
